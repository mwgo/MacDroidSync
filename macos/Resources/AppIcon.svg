<!--
  Application icon, the same artwork as the Android launcher icon
  (android/app/src/main/res/drawable/ic_app.xml): two arrows, one above the
  other, pointing opposite ways - the clipboard, the files and the presence all
  travel in both directions, which a clipboard glyph never said.

  The corners are rounded by stroking the outline in the fill colour with a round
  join, which is why the shafts are drawn 24 units thinner than they look.

  Regenerate AppIcon.icns after editing:  swift Tools/make-app-icon.swift
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <rect width="1024" height="1024" rx="229" ry="229" fill="#1B6AC9"/>
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round">
        <path d="M232,384 L412,284 L412,350 L792,350 L792,418 L412,418 L412,484 Z"/>
        <path d="M792,640 L612,540 L612,606 L232,606 L232,674 L612,674 L612,740 Z"/>
    </g>
</svg>
